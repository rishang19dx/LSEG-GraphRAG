schema:
  relation_types:
    - name: "SUBSIDIARY_OF"
      description: "Tail is the parent entity, Head is the subsidiary"
      head_types: ["Company"]
      tail_types: ["Company"]
    - name: "SUPPLIER_OF"
      description: "Head supplies components, materials, equipment, or services to Tail"
      head_types: ["Company"]
      tail_types: ["Company"]
    - name: "CUSTOMER_OF"
      description: "Head purchases products or services from Tail"
      head_types: ["Company"]
      tail_types: ["Company"]
    - name: "COMPETITOR_OF"
      description: "Head competes in products/markets with Tail"
      head_types: ["Company"]
      tail_types: ["Company"]
    - name: "OPERATES_IN"
      description: "Head conducts operations, manufacturing, or sales in geographic region/country Tail"
      head_types: ["Company"]
      tail_types: ["Region", "Country"]
    - name: "EXPOSED_TO"
      description: "Head has risk, dependency, or regulatory exposure to Tail"
      head_types: ["Company"]
      tail_types: ["RiskFactor", "Commodity", "Region", "Event", "RegulatoryPolicy"]

ingestion:
  form_type: "10-K"
  sections:
    - "item_1"    # Business
    - "item_1a"   # Risk Factors
    - "exhibit_21" # Subsidiaries list
  chunking:
    chunk_size: 1000
    chunk_overlap: 200
    respect_paragraphs: true

extraction:
  confidence_threshold: 0.70
  require_evidence_span: true
  batch_size: 5

resolution:
  similarity_threshold: 0.85
  use_alias_dictionary: true
  use_llm_disambiguation: true

retrieval:
  vector:
    top_k: 5
    similarity_metric: "cosine"
  graph:
    max_hops: 3
    max_subgraph_nodes: 50
    direction: "both"
  hybrid:
    top_k_chunks: 5
    graph_candidate_depth: 2
    graph_weight: 0.5
    vector_weight: 0.5

evaluation:
  hop_stratification: [1, 2, 3]
  question_types:
    - "direct_lookup"
    - "chained_relation"
    - "multi_hop_exposure"
    - "aggregation"
    - "path_reasoning"
  cost_model:
    prompt_token_cost_per_million: 0.150  # gpt-4o-mini pricing
    completion_token_cost_per_million: 0.600
