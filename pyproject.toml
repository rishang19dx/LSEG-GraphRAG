[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lseg-graphrag"
version = "0.1.0"
description = "Financial Knowledge Graph + GraphRAG for Multi-Hop Question Answering"
authors = [{ name = "Rishang" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "networkx>=3.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "scikit-learn>=1.3.0",
    "openai>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
]
ui = [
    "streamlit>=1.30.0",
    "pyvis>=0.3.2",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
